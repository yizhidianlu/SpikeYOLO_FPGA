name: Board Nightly Regression

on:
  schedule:
    - cron: "0 3 * * *"      # 每天 UTC 03:00（北京 11:00） — board_test
    - cron: "0 4 1 * *"      # 每月 1 号 UTC 04:00 — monthly_artifact (hosted runner)
  workflow_dispatch:
    inputs:
      duration:
        description: "FPS bench duration in seconds"
        type: number
        default: 300

jobs:
  # ----------------------------------------------------------------------
  # monthly_artifact: hosted runner snapshot of D1's perf + baseline JSONs.
  # Runs on the 1st of every month so we keep a 90-day rolling record of
  # the GPU/CPU FPS bench + baseline triple, independent of self-hosted
  # board availability. Non-blocking (continue-on-error) — losing a
  # snapshot must not fail the schedule.
  # ----------------------------------------------------------------------
  monthly_artifact:
    name: Monthly perf + baseline snapshot (hosted)
    if: ${{ github.event.schedule == '0 4 1 * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml

      - name: Resolve month tag
        id: tag
        run: echo "ym=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: FPS bench (CPU fallback on hosted runner — no GPU)
        # Hosted ubuntu-22.04 has no CUDA device, so we run CPU mode and
        # tag the snapshot accordingly. The on-device GPU/board numbers
        # come from board_test below and from D1's manual W4 runs.
        continue-on-error: true
        run: |
          mkdir -p runs/perf
          python tools/perf/fps_bench.py \
            --mode cpu \
            --frames 600 \
            --weights models/tiny_fpga_fp32.pt \
            --out runs/perf/fps_bench_cpu_${{ steps.tag.outputs.ym }}.json \
            || echo "fps_bench CPU snapshot skipped (weights or torch missing)"

      - name: Baseline triple snapshot (from cache)
        # Re-eval requires the full torch + ultralytics stack and big .pt
        # files. On hosted runner we instead just copy the latest cached
        # summary so it lands in the monthly artifact bundle.
        continue-on-error: true
        run: |
          if [ -f runs/baseline_summary.json ]; then
            python tools/quant/eval_baseline_triple.py \
              --from-cache runs/baseline_summary.json \
              --out runs/baseline_summary_${{ steps.tag.outputs.ym }}.json
          else
            echo "no cached baseline_summary.json — skipping"
          fi

      - name: Upload monthly snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-snapshot-${{ steps.tag.outputs.ym }}
          path: |
            runs/perf/fps_bench_*_${{ steps.tag.outputs.ym }}.json
            runs/baseline_summary_${{ steps.tag.outputs.ym }}.json
          if-no-files-found: warn
          retention-days: 90

  board_test:
    if: ${{ github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch' }}
    name: ZYBO Z7-20 end-to-end
    runs-on: [self-hosted, zybo]
    timeout-minutes: 120
    env:
      BOARD_HOST: zybo
      FPS_BENCH_DURATION: ${{ inputs.duration || 300 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Power on board
        run: bash scripts/wake_board.sh

      - name: Health check
        run: |
          ssh root@${BOARD_HOST} 'uname -a && uptime && ls /dev/video0 /dev/dri/card0 /dev/uio0'

      - name: Sync artifacts to board
        run: |
          python tools/ci/scp_to_board.py \
            --board ${BOARD_HOST} \
            --include sw/sdk/build/libspike_accel.so \
                      sw/app/build/spike_accel_demo \
                      models/tiny_fpga_int8.bin \
                      tests/golden/coco_val100.json

      - name: Full regression suite
        run: bash tests/regression/run_full.sh --full

      - name: FPS bench
        run: |
          python tools/perf/fps_bench.py \
            --board ${BOARD_HOST} \
            --duration ${FPS_BENCH_DURATION} \
            --min-fps 30 \
            --output runs/fps_bench.json

      - name: COCO val100 regression
        run: |
          python tests/regression/coco_val_on_board.py \
            --board ${BOARD_HOST} \
            --golden tests/golden/coco_val100.json \
            --pass-rate 0.95 \
            --output runs/coco_val100.json

      - name: DDR3 bandwidth check
        run: |
          python tools/perf/ddr_bw_monitor.py \
            --board ${BOARD_HOST} \
            --max-stall-pct 10

      - name: Generate milestone report
        if: always()
        run: |
          python tools/ci/gen_milestone_report.py \
            --regression-dir runs/ \
            --milestone $(cat .current_milestone 2>/dev/null || echo "M0") \
            --output docs/reports/nightly_$(date +%Y%m%d).md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-nightly-${{ github.run_id }}
          path: |
            runs/
            docs/reports/nightly_*.md
          retention-days: 90

      - name: Open issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "[nightly] Board regression failed run #${{ github.run_id }} ($(date +%F))" \
            --label "nightly-failure" \
            --body-file runs/summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Power off board
        if: always()
        run: bash scripts/sleep_board.sh
