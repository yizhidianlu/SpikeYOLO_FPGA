[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers used across Agent test suites
markers =
    contract: contract-level interface test (Contracts 1..6 in docs/CONTRACTS.md)
    bit_exact: bit-exact numerical regression (A2)
    cosim: HLS C-sim ↔ Co-sim (slow, opt-in)
    board: requires ZYBO board over SSH
    slow: longer than 30 s

# Default: skip board + cosim tests on plain `pytest`; CI opts in explicitly
addopts = -ra --strict-markers -m "not board and not cosim"
