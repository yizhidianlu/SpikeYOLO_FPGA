# sw/petalinux/.../linux/files/user_kernel.cfg
# Kernel fragment enabling everything C2/C3 need on the board.

# ---- USB UVC camera (Risk R5/R7) ----
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_GSPCA=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y

# ---- DRM/KMS (modern display stack — no fbdev legacy) ----
CONFIG_DRM=y
CONFIG_DRM_XLNX=y
CONFIG_FB=n
CONFIG_FRAMEBUFFER_CONSOLE=n

# ---- Xilinx DMA engines ----
CONFIG_XILINX_DMA=y
CONFIG_XILINX_VDMA=y

# ---- UIO + udmabuf (C2 user-space SDK path) ----
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
# u-dma-buf module installed by recipe sw/petalinux/.../recipes-modules/u-dma-buf

# ---- Contiguous Memory Allocator ----
CONFIG_CMA=y
CONFIG_CMA_SIZE_MBYTES=256

# ---- Debugability ----
CONFIG_DYNAMIC_DEBUG=y
CONFIG_PRINTK_TIME=y

# ---- PREEMPT_RT  (R3 mitigation if DMA latency too jittery) ----
# CONFIG_PREEMPT_RT=y    # uncomment when needed; lengthens build time
