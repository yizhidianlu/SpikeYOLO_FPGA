# /etc/modprobe.d/u-dma-buf.conf
# Allocate three udmabuf devices at module load time, sized to match
# the SDK's sa_init() expectations (sw/sdk/src/internal.h):
#   udmabuf0 = SA_WEIGHT_POOL_SIZE = 8 MB   (PBT INT8 weights, 1.34 MB used)
#   udmabuf1 = SA_INPUT_BUF_SIZE   = 256 KB (3*256*256 = 196608 B padded to page)
#   udmabuf2 = SA_OUTPUT_BUF_SIZE  = 64 KB  (84*16*16 = 21504 B padded to page)
options u-dma-buf udmabuf0=8388608 udmabuf1=262144 udmabuf2=65536
