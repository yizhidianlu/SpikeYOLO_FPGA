# A1 W8 — REAL training (val2017 alias as train, 30 epoch, ~3h, resumable).
# Owner: A1 Quantization (M1 W8, 2026-05-12).
# Activates KD-logits + spike_rate (W8 fix); resumable ckpt every epoch under
# runs/distill/resumable/ (latest.pt + epoch_NN.pt).
#
# val2017 alias = 5K images (train2017 18GB not downloaded locally).
# 30 epoch * 5K imgs / batch 16 ≈ 9400 step. v6 wallclock 1.0 s/it -> ~3h.

optimizer:    AdamW
lr:           5.0e-4
lr_schedule:  cosine
weight_decay: 1.0e-4
epochs:       30
batch_size:   16
warmup_epochs: 3

loss_weights:
  det:        1.0                 # standard YOLO detection loss
  kd_logits:  1.5                 # detect-head KD (cls KL@T + reg L1)  — W8 ACTIVE
  feat_align: 0.5                 # intermediate feature MSE             — active since W4
  spike_rate: 0.3                 # SNN spike-rate L1 (binary proxy)     — W8 ACTIVE

kd_temperature: 4.0

data:
  dataset_yaml: ultralytics/cfg/datasets/coco_sanity_val_alias.yaml
  val_every:    0                 # skip val (ultralytics 8.0.197 val-path Half/float bug)
  imgsz:        256

freeze_teacher: true
adapter_init:   "kaiming"
seed:           42

teacher_inference_mode: avgpool_from_640
device:        cuda
log_interval:  10                  # iterations between distill_log.csv rows
ckpt_interval: 1                   # epochs between resumable + state_dict snapshot
distill_alignment_layers: [5, 7, 8]
amp:               false           # FP16 autocast triggers conv bias dtype mismatch in SNN val path
gradient_clip_norm: 1.0
data_loader_workers: 2
prefetch_factor:    2

# W8 NEW: resumable ckpt directory. start_real_training.bat auto-detects
# resume_dir/latest.pt and adds --resume-auto.
resume_dir: runs/distill/resumable/
