# A2-W11 5-class subset on COCO train2017 — for tiny_fpga 1.16M demo deploy.
#
# Decision: keep nc=80 + original class ids so:
#   1. snn_yolov8_tiny_fpga.yaml detection head channel count stays the same
#   2. HLS IP SA_NC=80 doesn't need rebuild
#   3. PTQ pipeline + weight_packer shape-adaptive, no changes
#   4. board-side postproc_nms.cpp does the class-filter (suppress all but
#      these 5 class ids)
#
# Generated by:
#   python tools/quant/filter_coco_5class.py \
#       --src-labels C:/Users/jielu/Desktop/Project/UI/RK3588/YOLOv8/datasets/coco/labels \
#       --src-images C:/Users/jielu/Desktop/Project/UI/RK3588/YOLOv8/datasets/coco/images \
#       --out C:/Users/jielu/Desktop/Project/UI/RK3588/YOLOv8/datasets/coco_5class
#
# 5 kept class ids (high-frequency, desktop-demo friendly):
#   0  person       (257K train instances)
#   39 bottle       ( 24K)
#   41 cup          ( 24K)
#   67 cell phone   (  7K)
#   73 book         ( 24K)

# Ultralytics dataset loader: when 'train'/'val' point to a .txt file, each
# line is treated as an image path; labels are looked up in <out_root>/labels/
# by stem+suffix swap. Our filter_coco_5class.py emits exactly this layout.
path: C:/Users/jielu/Desktop/Project/UI/RK3588/YOLOv8/datasets/coco_5class
train: train2017.txt        # image list, only imgs that have at least 1 of the 5 classes
val:   val2017.txt

